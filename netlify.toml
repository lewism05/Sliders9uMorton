# Netlify configuration for the Sliders Coaching Dashboard.
# Most important bit: data.json must NOT be cached by the CDN, otherwise
# your phone will keep seeing yesterday's lineup.

[build]
  publish = "."

# data.json is the live data feed. Always re-fetch from origin.
[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate, max-age=0"
    Pragma = "no-cache"
    Expires = "0"

# index.html updates rarely — fine to cache briefly but always revalidate.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
